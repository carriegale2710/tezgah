name: Bug Report
description: Report a bug or issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill in the information below.
  - type: dropdown
    id: skill
    attributes:
      label: Related Skill
      description: Which skill is this related to?
      options:
        - saas-launcher
        - saas-auth
        - saas-payments
        - saas-email
        - saas-landing-seo
        - saas-api-security
        - saas-deployment
        - CLI (tezgah command)
        - General
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: What happened? What did you expect to happen?
      placeholder: |
        Expected behavior: ...
        Actual behavior: ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the issue
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: textarea
    id: context
    attributes:
      label: Additional Information
      description: Tech stack, Node.js version, operating system, etc.
